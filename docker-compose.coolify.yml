# Production stack for Coolify: the store, its MongoDB (one-node replica set,
# for transactions), MediaMTX for live selling and a small scheduler that runs
# the jobs vercel.json lists. Media lives in Cloudflare R2 (MinIO's community
# edition is discontinued: no images, binaries or fixes). Domains are assigned
# in Coolify (app -> 3000, mediamtx -> 8889); every ${VAR} below is an
# environment variable set there.
services:
  app:
    build:
      context: .
      dockerfile: deploy/coolify/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
        NEXT_PUBLIC_LOYALTY_ENABLED: ${NEXT_PUBLIC_LOYALTY_ENABLED:-}
        NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY: ${NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY:-}
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        NEXT_PUBLIC_FACEBOOK_PIXEL_ID: ${NEXT_PUBLIC_FACEBOOK_PIXEL_ID:-}
        NEXT_PUBLIC_TIKTOK_PIXEL_ID: ${NEXT_PUBLIC_TIKTOK_PIXEL_ID:-}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      TZ: Asia/Bangkok
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/ohkshop
      MONGODB_DB_NAME: ohkshop
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      INSTALL_TOKEN: ${INSTALL_TOKEN}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
      NEXT_PUBLIC_LOYALTY_ENABLED: ${NEXT_PUBLIC_LOYALTY_ENABLED:-}
      AI_HERO_BANNER_ENABLED: ${AI_HERO_BANNER_ENABLED:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CRON_SECRET: ${CRON_SECRET}
      MESSAGING_ENCRYPTION_KEY: ${MESSAGING_ENCRYPTION_KEY}
      STORAGE_ACCOUNT_ID: ${STORAGE_ACCOUNT_ID}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-ohkshop-media}
      STORAGE_PRIVATE_BUCKET: ${STORAGE_PRIVATE_BUCKET:-ohkshop-private}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
      LIVE_MEDIA_PUBLIC_URL: ${LIVE_MEDIA_PUBLIC_URL:-}
      LIVE_MEDIA_API_URL: http://mediamtx:9997
      LIVE_RTMP_PUBLIC_URL: ${LIVE_RTMP_PUBLIC_URL:-}
    volumes:
      - next-cache:/app/.next/cache

  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 5s
      timeout: 5s
      retries: 30

  mediamtx:
    build:
      context: .
      dockerfile: deploy/coolify/mediamtx.Dockerfile
    restart: unless-stopped
    ports:
      - "8189:8189/udp"
      - "8189:8189/tcp"
      - "1935:1935"

  cron:
    build:
      context: .
      dockerfile: deploy/coolify/cron.Dockerfile
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET}
      APP_INTERNAL_URL: http://app:3000

volumes:
  mongo-data:
  next-cache:
